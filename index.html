<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>3D Spider-Man: Kontrol MPU-9265 - Mode Perburuan Musuh</title>
<style>
  body { margin: 0; overflow: hidden; background: #080c14; cursor: pointer; user-select: none; }
  canvas { display: block; }
  
  /* Panel UI Utama */
  #ui {
    position: absolute; top: 20px; left: 20px;
    color: #f1f5f9; font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold;
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
    padding: 14px 18px; border-radius: 10px; z-index: 10;
    pointer-events: none; border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 10px 30px -5px rgba(0,0,0,0.5);
  }

  /* Tracker Target Musuh */
  #target-ui {
    position: absolute; top: 20px; right: 20px;
    color: #ef4444; font-family: 'Courier New', monospace; font-size: 15px; font-weight: bold;
    background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
    padding: 12px 18px; border-radius: 8px; z-index: 10;
    pointer-events: none; border: 2px solid #ef4444;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); text-align: right;
  }
  #target-status { font-size: 11px; color: #fca5a5; margin-top: 4px; text-transform: uppercase; }

  #crosshair {
    position: absolute; top: 50%; left: 50%;
    width: 16px; height: 16px;
    border: 2.5px solid rgba(255,255,255,0.95); border-radius: 50%;
    transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
  }
  #crosshair::after {
    content: ''; position: absolute; top: 6px; left: 6px; width: 4px; height: 4px;
    background: #ef4444; border-radius: 50%;
  }

  #start-screen {
    position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(8, 10, 18, 0.9); backdrop-filter: blur(15px);
    color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif;
    font-size: 24px; z-index: 20; text-align: center; font-weight: 600;
    letter-spacing: 0.5px;
  }
  #start-screen span {
    font-size: 15px; color: #94a3b8; margin-top: 12px; font-weight: 400;
  }

  #notif {
    position: absolute; left: 20px; bottom: 20px; width: 420px; max-width: 90vw;
    font-family: monospace; font-size: 12px; z-index: 15; pointer-events: none;
  }
  .n {
    background: rgba(15, 23, 42, 0.95); color: #f8fafc; padding: 10px 14px; margin-top: 8px;
    border-left: 4px solid #10b981; border-radius: 6px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.05); border-left-width: 4px;
  }
  .n.warn { border-left-color: #f59e0b; }
  .n.err  { border-left-color: #ef4444; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div id="start-screen">
  KLIK UNTUK MEMULAI PERBURUAN
  <span>Gunakan Gyro MPU-9265 atau gerakan Mouse &amp; Klik Kiri untuk berayun jaring &amp; menangkap musuh! 🕸️</span>
</div>

<div id="ui">
  <div id="status">Status: Menghubungkan ke ESP32...</div>
  <div id="val">roll: 0  pitch: 0</div>
</div>

<div id="target-ui">
  TARGET: <span id="dist-val">0</span>m
  <div id="target-status">MELARIKAN DIRI 🚨</div>
</div>

<div id="crosshair"></div>
<div id="notif"></div>

<script>
// --- 1. NOTIFIKASI ---
const notifEl = document.getElementById('notif');
function tampilNotif(teks, level) {
  const jam = new Date().toLocaleTimeString('id-ID');
  const d = document.createElement('div');
  d.className = 'n ' + (level || '');
  d.textContent = '[' + jam + '] ' + teks;
  notifEl.appendChild(d);
  while (notifEl.children.length > 5) notifEl.removeChild(notifEl.firstChild);
  setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 10000);
}
function levelDari(teks) {
  const t = teks.toUpperCase();
  if (t.includes('RESTART') || t.includes('MACET') || t.includes('GAGAL')) return 'err';
  if (t.includes('LEMAH') || t.includes('HABIS') || t.includes('PUTUS')) return 'warn';
  return '';
}

// --- 2. WEBSOCKET ESP32 ---
const ESP_IP = "192.168.4.1";
let ws;
let lastMsg = Date.now();
const statusEl = document.getElementById('status');
const valEl = document.getElementById('val');

let yaw = 0, pitch = 0, tiltRoll = 0, tiltPitch = 0;
const DEADZONE_ROLL = 4, DEADZONE_PITCH = 2;
const YAW_GAIN = 0.07, PITCH_GAIN = 1.3;

function connectWebSocket() {
  if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }
  ws = new WebSocket('ws://' + ESP_IP + ':81');
  ws.onopen = () => {
    lastMsg = Date.now();
    statusEl.innerText = "ESP32 Terhubung! Gerakkan kontrol Anda";
  };
  ws.onerror = () => {
    statusEl.innerText = "Gagal Connect (Gunakan fallback mouse/keyboard)";
  };
  ws.onclose = () => {
    statusEl.innerText = "Mencoba menghubungkan ulang ke ESP32...";
    setTimeout(connectWebSocket, 2000);
  };
  ws.onmessage = (event) => {
    lastMsg = Date.now();
    const d = event.data;
    if (d === "shoot") {
      shootAndSwing();
    } else if (d.startsWith("t:")) {
      const p = d.split(":");
      tiltRoll  = parseFloat(p[1]);
      tiltPitch = parseFloat(p[2]);
      valEl.innerText = "roll: " + tiltRoll.toFixed(0) + "  pitch: " + tiltPitch.toFixed(0);
    } else if (d.startsWith("n:")) {
      tampilNotif("ESP32: " + d.substring(2), levelDari(d.substring(2)));
    }
  };
}
connectWebSocket();

document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c' && ws && ws.readyState === 1) {
    ws.send('cal');
    tampilNotif("Kalibrasi dikirim ke sensor");
  }
});

// Fallback Mouse Look
let isPointerLocked = false;
document.addEventListener('click', () => {
  const s = document.getElementById('start-screen');
  if (s.style.display !== 'none') {
    s.style.display = 'none';
    document.body.requestPointerLock();
  } else {
    shootAndSwing();
  }
});

document.addEventListener('pointerlockchange', () => {
  isPointerLocked = (document.pointerLockElement === document.body);
});

document.addEventListener('mousemove', (e) => {
  if (isPointerLocked) {
    yaw -= e.movementX * 0.0025;
    pitch -= e.movementY * 0.0025;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
  }
});

// --- 3. TEKSTUR & MATERIAL PROSEDURAL REALISTIS ---
function createFacadeTexture(type) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  if (type === 'modern_glass') {
    ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, 512, 1024);
    ctx.fillStyle = '#1e293b';
    for (let i = 0; i < 1024; i += 64) ctx.fillRect(0, i, 512, 6);
    for (let j = 0; j < 512; j += 32) ctx.fillRect(j, 0, 3, 1024);

    for (let y = 16; y < 1024; y += 32) {
      for (let x = 8; x < 512; x += 16) {
        if (Math.random() > 0.3) {
          ctx.fillStyle = Math.random() > 0.15 ? '#38bdf8' : '#fbbf24';
          ctx.globalAlpha = 0.4 + Math.random() * 0.6;
          ctx.fillRect(x, y, 10, 20);
        }
      }
    }
  } else if (type === 'classic_brick') {
    ctx.fillStyle = '#451a03'; ctx.fillRect(0, 0, 512, 1024);
    ctx.fillStyle = '#1e0c02';
    for (let y = 0; y < 1024; y += 6) ctx.fillRect(0, y, 512, 2);
    for (let y = 0; y < 1024; y += 12) {
      for (let x = (y % 24); x < 512; x += 24) ctx.fillRect(x, y, 2, 6);
    }
    ctx.globalAlpha = 1.0;
    for (let y = 40; y < 1024; y += 96) {
      for (let x = 32; x < 512; x += 64) {
        ctx.fillStyle = '#334155'; ctx.fillRect(x - 2, y - 2, 24, 44);
        ctx.fillStyle = Math.random() > 0.45 ? '#fef08a' : '#1e293b';
        ctx.fillRect(x, y, 20, 40);
      }
    }
  } else {
    ctx.fillStyle = '#334155'; ctx.fillRect(0, 0, 512, 1024);
    ctx.fillStyle = '#1e293b';
    for (let y = 0; y < 1024; y += 128) ctx.fillRect(0, y, 512, 4);
    for (let x = 0; x < 512; x += 128) ctx.fillRect(x, 0, 4, 1024);
    for (let y = 20; y < 1024; y += 64) {
      for (let x = 15; x < 512; x += 48) {
        if (Math.random() > 0.25) {
          ctx.fillStyle = Math.random() > 0.3 ? '#60a5fa' : '#fef08a';
          ctx.fillRect(x, y, 24, 18);
        }
      }
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

function createRoadTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 1024;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, 1024, 1024);
  ctx.fillStyle = '#0f172a';
  for(let i=0; i<4000; i++) ctx.fillRect(Math.random()*1024, Math.random()*1024, 2, 2);

  ctx.fillStyle = '#eab308';
  ctx.fillRect(506, 0, 4, 1024); ctx.fillRect(514, 0, 4, 1024);

  ctx.fillStyle = '#ffffff';
  for(let y=20; y<1024; y+=80) {
    ctx.fillRect(256, y, 6, 40); ctx.fillRect(768, y, 6, 40);
  }

  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(10, 0, 12, 1024); ctx.fillRect(1002, 0, 12, 1024);

  for(let y=0; y<1024; y+=160) {
    if (Math.random() > 0.75) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for(let x=100; x<924; x+=50) ctx.fillRect(x, y, 30, 20);
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(1, 10);
  return texture;
}

function createSidewalkTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#64748b'; ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#475569';
  for(let i=0; i<256; i+=64) ctx.fillRect(i, 0, 2, 256);
  for(let j=0; j<256; j+=64) ctx.fillRect(0, j, 256, 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

// --- 4. SCENE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x93c5fd);
scene.fog = new THREE.FogExp2(0x93c5fd, 0.0008);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 4000);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// Lighting
const sunLight = new THREE.DirectionalLight(0xfff8ee, 2.8);
sunLight.position.set(500, 800, 300);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048; sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5; sunLight.shadow.camera.far = 1600;
const d = 900;
sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d;
sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
scene.add(sunLight);

const ambientLight = new THREE.AmbientLight(0x93c5fd, 0.95);
scene.add(ambientLight);

// --- 5. CUACA & AWAN ---
const cloudGroup = new THREE.Group();
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, flatShading: true });

for (let i = 0; i < 45; i++) {
  const cloud = new THREE.Group();
  const numBlobs = 3 + Math.floor(Math.random() * 5);
  for (let b = 0; b < numBlobs; b++) {
    const r = 30 + Math.random() * 35;
    const blob = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 1), cloudMat);
    blob.position.set(b * 35 - 50, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 15);
    blob.scale.set(1.4, 0.7, 1);
    cloud.add(blob);
  }
  cloud.position.set((Math.random() - 0.5) * 2000, 300 + Math.random() * 150, (Math.random() - 0.5) * 2000);
  cloud.userData = { speed: 0.05 + Math.random() * 0.15 };
  cloudGroup.add(cloud);
}
scene.add(cloudGroup);

// Pesawat Terbang & Contrail
const planeGroup = new THREE.Group();
const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 25, 8), new THREE.MeshStandardMaterial({ color: 0xe2e8f0 }));
fuselage.rotation.z = Math.PI / 2;
planeGroup.add(fuselage);
const wings = new THREE.Mesh(new THREE.BoxGeometry(26, 0.4, 6), new THREE.MeshStandardMaterial({ color: 0xe2e8f0 }));
wings.position.set(0, 0, 2);
planeGroup.add(wings);
planeGroup.position.set(-1200, 550, (Math.random() - 0.5) * 800);
scene.add(planeGroup);

// --- 6. VARIASI POHON REALISTIS DENGAN BERBAGAI WARNA & BENTUK ---
const treeColors = [
  0x15803d, // Hijau Tua Rimba
  0x16a34a, // Hijau Segar
  0x22c55e, // Hijau Terang
  0x65a30d, // Hijau Zaitun
  0xd97706, // Kuning Keemasan / Autumn
  0xb45309  // Oranye Musim Gugur
];

function createDiverseTree(x, z) {
  const tree = new THREE.Group();
  
  // Batang Kayu
  const trunkGeo = new THREE.CylinderGeometry(0.5, 0.9, 12, 8);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3f2d21, roughness: 0.9 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 6;
  trunk.castShadow = true;
  tree.add(trunk);

  // Pilih Warna & Bentuk Dedaunan Secara Acak
  const leafColor = treeColors[Math.floor(Math.random() * treeColors.length)];
  const leavesMat = new THREE.MeshStandardMaterial({ color: leafColor, roughness: 0.8, flatShading: true });
  const treeType = Math.floor(Math.random() * 3); // 0: Berlapis, 1: Cemara/Kerucut, 2: Bulat

  if (treeType === 0) {
    // Tipe 0: Berlapis Rimbun (Dodecahedron)
    for (let i = 0; i < 4; i++) {
      const s = 10 - i * 2;
      const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 1), leavesMat);
      leaves.position.y = 9 + i * 3.5;
      leaves.rotation.y = Math.random() * Math.PI;
      leaves.scale.set(1.1, 0.8, 1.1);
      leaves.castShadow = true;
      tree.add(leaves);
    }
  } else if (treeType === 1) {
    // Tipe 1: Cemara / Pine (Cone)
    for (let i = 0; i < 3; i++) {
      const r = 8 - i * 2;
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(r, 8, 8), leavesMat);
      leaves.position.y = 10 + i * 4.5;
      leaves.castShadow = true;
      tree.add(leaves);
    }
  } else {
    // Tipe 2: Bulat Organik (Icosahedron)
    const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(8, 2), leavesMat);
    leaves.position.y = 13;
    leaves.scale.set(1.1, 0.9, 1.1);
    leaves.castShadow = true;
    tree.add(leaves);
  }

  tree.position.set(x, 0, z);
  scene.add(tree);
}

// --- 7. INFRASTRUKTUR & GEDUNG ---
const groundMat = new THREE.MeshStandardMaterial({ map: createRoadTexture(), roughness: 0.95 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const sidewalkMat = new THREE.MeshStandardMaterial({ map: createSidewalkTexture(), roughness: 0.8 });
const buildings = [];
const facadeMaterials = [
  new THREE.MeshStandardMaterial({ map: createFacadeTexture('modern_glass'), roughness: 0.1, metalness: 0.9 }),
  new THREE.MeshStandardMaterial({ map: createFacadeTexture('classic_brick'), roughness: 0.8 }),
  new THREE.MeshStandardMaterial({ map: createFacadeTexture('concrete_panel'), roughness: 0.5 })
];

function buildRealisticBuilding(x, z, height, w, d) {
  const buildingGroup = new THREE.Group();
  buildingGroup.position.set(x, 0, z);

  const mainGeo = new THREE.BoxGeometry(w, height, d);
  const uv = mainGeo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setY(i, uv.getY(i) * (height / 50));
  
  const mat = facadeMaterials[Math.floor(Math.random() * facadeMaterials.length)];
  const body = new THREE.Mesh(mainGeo, mat);
  body.position.y = height / 2;
  body.castShadow = true; body.receiveShadow = true;
  buildingGroup.add(body);

  // Tandon Air Kayu / Baja (Water Tank)
  const roofH = height;
  if (Math.random() > 0.3) {
    const tankGroup = new THREE.Group();
    const tankGeo = new THREE.CylinderGeometry(3.5, 3.5, 8, 10);
    const tankMat = new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.8 });
    const tank = new THREE.Mesh(tankGeo, tankMat);
    tank.position.y = 4;
    tankGroup.add(tank);

    const legGeo = new THREE.CylinderGeometry(0.2, 0.2, 5, 6);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
    for(let l=0; l<4; l++) {
      const leg = new THREE.Mesh(legGeo, legMat);
      const angle = (l * Math.PI) / 2;
      leg.position.set(Math.cos(angle)*2.5, 2.5, Math.sin(angle)*2.5);
      tankGroup.add(leg);
    }
    tankGroup.position.set((Math.random()-0.5)*(w-12), roofH, (Math.random()-0.5)*(d-12));
    tankGroup.castShadow = true;
    buildingGroup.add(tankGroup);
  }

  // Helipad
  if (Math.random() > 0.6) {
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(w*0.3, w*0.3, 0.4, 16), new THREE.MeshStandardMaterial({ color: 0x334155 }));
    pad.position.set(0, roofH + 0.2, 0);
    buildingGroup.add(pad);
  }

  // Antena Komunikasi Radio
  if (Math.random() > 0.5) {
    const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.4, 30, 6), new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9 }));
    antenna.position.set((Math.random()-0.5)*(w-10), roofH + 15, (Math.random()-0.5)*(d-10));
    
    const warnLight = new THREE.Mesh(new THREE.SphereGeometry(0.8, 6, 6), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
    warnLight.position.y = 15;
    antenna.add(warnLight);
    antenna.castShadow = true;
    buildingGroup.add(antenna);
  }

  scene.add(buildingGroup);
  buildings.push(body);
}

// Tata Letak Kota Diperlebar
const blockSize = 180;
for (let x = -1200; x <= 1200; x += blockSize) {
  for (let z = -1200; z <= 1200; z += blockSize) {
    if (Math.abs(x) < 90 && Math.abs(z) < 90) continue;

    const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(blockSize - 30, 1.5, blockSize - 30), sidewalkMat);
    sidewalk.position.set(x, 0.75, z);
    sidewalk.receiveShadow = true;
    scene.add(sidewalk);

    // Tanam Banyak Pohon Berwarna-warni di Sekitar Trotoar & Jalanan
    createDiverseTree(x + 65, z + 65);
    createDiverseTree(x - 65, z - 65);
    createDiverseTree(x + 65, z - 65);
    createDiverseTree(x - 65, z + 65);

    const bH = 120 + Math.random() * 140;
    const bW = 50;
    const bD = 50;
    buildRealisticBuilding(x, z, bH, bW, bD);
  }
}

// Tanam Pohon Tambahan di Sepanjang Bahu Jalan Raya
for (let p = 0; p < 120; p++) {
  const rx = (Math.random() - 0.5) * 2200;
  const rz = (Math.random() - 0.5) * 2200;
  if (Math.abs(rx) > 100 || Math.abs(rz) > 100) createDiverseTree(rx, rz);
}

// --- 8. KARAKTER MUSUH REALISTIS & NAVIGASI PASTI ---
const enemyGroup = new THREE.Group();

const armorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3, metalness: 0.8 });
const redGlowMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });

const torso = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 2), armorMat);
torso.position.y = 4;
torso.castShadow = true;
enemyGroup.add(torso);

const head = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), armorMat);
head.position.set(0, 6.8, 0);
const visor = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 0.4), redGlowMat);
visor.position.set(0, 6.9, 0.7);
enemyGroup.add(head, visor);

const armL = new THREE.Mesh(new THREE.BoxGeometry(1, 3.5, 1), armorMat); armL.position.set(-2.2, 4, 0);
const armR = new THREE.Mesh(new THREE.BoxGeometry(1, 3.5, 1), armorMat); armR.position.set(2.2, 4, 0);
const legL = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3.8, 1.2), armorMat); legL.position.set(-0.8, 1.9, 0);
const legR = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3.8, 1.2), armorMat); legR.position.set(0.8, 1.9, 0);
enemyGroup.add(armL, armR, legL, legR);

const jetpack = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 1), armorMat);
jetpack.position.set(0, 4.2, -1.2);
const thrusterL = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.2, 1), redGlowMat); thrusterL.position.set(-0.6, 2.6, -1.2);
const thrusterR = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.2, 1), redGlowMat); thrusterR.position.set(0.6, 2.6, -1.2);
enemyGroup.add(jetpack, thrusterL, thrusterR);

// TENTUKAN POSISI AWAL DAN RUTE LOKASI WAYPOINTS PASTI
const enemyWaypoints = [
  new THREE.Vector3(180, 150, -180),
  new THREE.Vector3(360, 160, 0),
  new THREE.Vector3(180, 140, 360),
  new THREE.Vector3(-180, 155, 180),
  new THREE.Vector3(-360, 145, -180)
];

let currentWaypointIndex = 0;
enemyGroup.position.copy(enemyWaypoints[0]);
scene.add(enemyGroup);

let enemyCaptured = false;

// PERGERAKAN MUSUH: DIAM 8 DETIK & LOMPATAN HALUS 3.5 DETIK
function moveEnemyAI() {
  if (enemyCaptured) return;

  currentWaypointIndex = (currentWaypointIndex + 1) % enemyWaypoints.length;
  const targetPos = enemyWaypoints[currentWaypointIndex];

  gsap.to(enemyGroup.position, {
    x: targetPos.x,
    y: targetPos.y + 35,
    z: targetPos.z,
    duration: 3.5,
    ease: "power1.inOut",
    onComplete: () => {
      gsap.to(enemyGroup.position, { y: targetPos.y, duration: 0.6, ease: "bounce.out" });
    }
  });
}

setInterval(moveEnemyAI, 8000);

// --- 9. SISTEM WEBSHOOTING & SWING ---
const raycaster = new THREE.Raycaster();
let isSwinging = false;
let webMesh = null, webSplatMesh = null;

const splatTexture = (function(){
  const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d'); ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 4;
  for(let r = 20; r < 120; r += 20) { ctx.beginPath(); ctx.arc(128, 128, r, 0, Math.PI * 2); ctx.stroke(); }
  for(let a = 0; a < Math.PI * 2; a += Math.PI / 6) { ctx.beginPath(); ctx.moveTo(128, 128); ctx.lineTo(128 + Math.cos(a)*120, 128 + Math.sin(a)*120); ctx.stroke(); }
  return new THREE.CanvasTexture(canvas);
})();

function createWebTube(p1, p2) {
  const path = new THREE.LineCurve3(p1, p2);
  const tubeGeo = new THREE.TubeGeometry(path, 12, 0.35, 8, false);
  return new THREE.Mesh(tubeGeo, new THREE.MeshBasicMaterial({ color: 0xf8fafc }));
}

function shootAndSwing() {
  if (isSwinging) return;
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  // Tembak Musuh Secara Langsung
  const enemyIntersects = raycaster.intersectObject(torso);
  if (enemyIntersects.length > 0 && !enemyCaptured) {
    captureEnemy();
    return;
  }

  // Berayun ke Gedung
  const intersects = raycaster.intersectObjects(buildings);
  if (intersects.length === 0) return;

  isSwinging = true;
  const hitPoint = intersects[0].point;
  const normal = intersects[0].face.normal.clone();
  normal.transformDirection(intersects[0].object.matrixWorld);

  webMesh = createWebTube(camera.position.clone().sub(new THREE.Vector3(0, 2, 0)), hitPoint);
  scene.add(webMesh);

  const splatMat = new THREE.MeshBasicMaterial({ map: splatTexture, transparent: true, depthWrite: false });
  webSplatMesh = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), splatMat);
  webSplatMesh.position.copy(hitPoint).addScaledVector(normal, 0.15);
  webSplatMesh.lookAt(hitPoint.clone().add(normal));
  scene.add(webSplatMesh);

  const targetCamPos = hitPoint.clone().add(new THREE.Vector3(0, 20, 35));
  gsap.to(camera.position, {
    x: targetCamPos.x,
    y: targetCamPos.y,
    z: targetCamPos.z,
    duration: 1.5,
    ease: "power2.inOut",
    onUpdate: () => {
      if (webMesh) {
        scene.remove(webMesh);
        webMesh.geometry.dispose();
        webMesh = createWebTube(camera.position.clone().sub(new THREE.Vector3(0, 2, 0)), hitPoint);
        scene.add(webMesh);
      }
    },
    onComplete: () => {
      if (webMesh) scene.remove(webMesh);
      if (webSplatMesh) scene.remove(webSplatMesh);
      isSwinging = false;
    }
  });
}

function captureEnemy() {
  enemyCaptured = true;
  tampilNotif("BERHASIL! MUSUH TERTANGKAP DENGAN JARING! 🕸️⚡", "");
  document.getElementById('target-status').innerText = "TERTANGKAP ✅";
  document.getElementById('target-status').style.color = "#10b981";

  const netGeo = new THREE.SphereGeometry(6, 12, 12);
  const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
  const net = new THREE.Mesh(netGeo, netMat);
  net.position.y = 3;
  enemyGroup.add(net);

  gsap.killTweensOf(enemyGroup.position);
}

camera.position.set(0, 110, 0);

// --- 10. RENDER LOOP ---
const distValEl = document.getElementById('dist-val');

function animate(time) {
  requestAnimationFrame(animate);

  // Control Gyro MPU
  if (Math.abs(tiltRoll) > DEADZONE_ROLL) {
    let r = tiltRoll - Math.sign(tiltRoll) * DEADZONE_ROLL;
    yaw -= Math.max(-45, Math.min(45, r)) * YAW_GAIN * Math.PI / 180;
  }
  if (Math.abs(tiltPitch) > DEADZONE_PITCH) {
    let p = tiltPitch - Math.sign(tiltPitch) * DEADZONE_PITCH;
    const targetPitch = Math.max(-1.3, Math.min(1.3, p * PITCH_GAIN * Math.PI / 180));
    pitch += (targetPitch - pitch) * 0.2;
  }

  if(!isPointerLocked) {
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  } else {
    yaw = camera.rotation.y;
    pitch = camera.rotation.x;
  }

  // Update Awan & Pesawat
  cloudGroup.children.forEach(c => {
    c.position.x += c.userData.speed;
    if (c.position.x > 1500) c.position.x = -1500;
  });
  planeGroup.position.x += 1.4;
  if (planeGroup.position.x > 1500) planeGroup.position.x = -1500;

  // Hitung Jarak Kejar
  const dist = Math.floor(camera.position.distanceTo(enemyGroup.position));
  distValEl.innerText = dist;

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
